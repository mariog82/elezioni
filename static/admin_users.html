<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestione utenti</title><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body><header><h1>Gestione utenti</h1><div>Rappresentanti, sezioni e liste autorizzate</div></header><main>
<section class="card topbar"><button class="secondary" onclick="location.href='/admin'">Pannello admin</button><div><button onclick="loadDashboard()">Aggiorna</button><button class="secondary" onclick="location.href='/'">Torna all'app</button></div></section>
<section class="card"><h2>Nuovo utente</h2><div class="grid"><input id="newName" placeholder="Nome"><input id="newPhone" placeholder="Telefono/codice"><input id="newPin" placeholder="PIN"><input id="newSection" placeholder="Sezione"><select id="newRole"><option value="rappresentante">rappresentante</option><option value="admin">admin</option></select><input id="newAllowedLists" placeholder="Liste autorizzate separate da | (vuoto = tutte)"></div><button onclick="createUser()">Aggiungi rappresentante/utente</button><p class="small">Esempio: PARTITO DEMOCRATICO|MOVIMENTO 5STELLE. L'amministratore vede sempre tutte le liste.</p><div id="users"></div></section>
<div id="editUserModal" class="modal hidden"><div class="modalContent"><h2>Modifica utente</h2><input id="editUserId" type="hidden"><label>Nome</label><input id="editUserName"><label>Telefono/codice</label><input id="editUserPhone"><label>Sezione</label><input id="editUserSection"><label>Ruolo</label><select id="editUserRole"><option value="rappresentante">rappresentante</option><option value="admin">admin</option></select><label>Nuovo PIN (facoltativo)</label><input id="editUserPin"><label>Liste autorizzate separate da | (vuoto = tutte)</label><input id="editUserAllowedLists"><div class="actions"><button onclick="saveEditUserPopupEnhanced()">Salva</button><button class="secondary" onclick="closeEditUserPopup()">Annulla</button></div></div></div>
</main><script src="/admin.js"></script><script>function openEditUserPopup(id){const u=usersCache.find(x=>x.id===id);if(!u)return alert('Utente non trovato');editUserId.value=u.id;editUserName.value=u.name||'';editUserPhone.value=u.phone||'';editUserSection.value=u.section||'';editUserRole.value=u.role||'rappresentante';editUserPin.value='';editUserAllowedLists.value=u.allowed_lists||'';editUserModal.classList.remove('hidden')}async function saveEditUserPopupEnhanced(){const id=editUserId.value;const payload={name:editUserName.value.trim(),phone:editUserPhone.value.trim(),section:editUserSection.value.trim(),role:editUserRole.value,pin:editUserPin.value.trim(),allowed_lists:(editUserAllowedLists.value||'').split('|').map(x=>x.trim()).filter(Boolean)};try{const r=await api(`/api/users/${id}`,{method:'PATCH',body:JSON.stringify(payload)});alert(r.message||'Utente aggiornato');closeEditUserPopup();await loadUsers()}catch(e){alert(e.message)}}</script></body></html>
